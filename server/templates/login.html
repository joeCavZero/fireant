<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - FIREANT</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='/css/index.css') }}"
    >
</head>

<body>

<main class="auth-page">

    <div class="auth-card">

        <a href="/" class="brand auth-brand">
            <img
                src="{{ url_for('static', path='/images/fireant-logo.png') }}"
                alt="Fireant"
            >

            <div class="brand-text">
                <strong>FIREANT</strong>
                <span>IoT Monitoring Platform</span>
            </div>
        </a>

        <div class="auth-header">
            <h1>Welcome Back</h1>

            <p>
                Sign in to access your nodes, sensors and telemetry data.
            </p>
        </div>

        {% if error %}
            <div class="auth-alert">
                {{ error }}
            </div>
        {% endif %}

        <form method="post" action="/login" class="auth-form">

            <input
                type="text"
                name="username"
                placeholder="Username"
                required
            >

            <input
                type="password"
                name="password"
                placeholder="Password"
                required
            >

            <button type="submit" class="button-primary">
                Sign In
            </button>

        </form>

        <div class="auth-footer">
            <span>Don't have an account?</span>

            <a href="/register">
                Create account
            </a>
        </div>

    </div>

</main>

</body>
</html>
